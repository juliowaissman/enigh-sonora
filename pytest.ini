[pytest]
testpaths = tests
# ``integration`` marca las pruebas que leen data/processed (los Parquet
# reales de la ENIGH). Se saltan solas si esos datos no existen, para que CI
# corra en segundos sin descargar 287 MB.
markers =
    integration: requiere los datos procesados reales en data/processed
addopts = -ra
filterwarnings =
    error::DeprecationWarning:enigh.*
    error::FutureWarning:enigh.*
