name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Revisar estilo
        run: python -m ruff check enigh/ tests/ app.py

      - name: Ejecutar pruebas
        # Las pruebas no tocan la red ni los ZIP de INEGI: usan un conjunto
        # sintético con el mismo esquema, así que corren en segundos.
        run: python -m pytest tests/ -v

      - name: Verificar que el paquete importa y la CLI responde
        run: |
          python -c "import enigh; print(enigh.__version__)"
          python -m enigh.pipeline --help
